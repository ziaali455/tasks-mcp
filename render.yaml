services:
  - type: web
    name: tasks-mcp
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync --frozen --no-dev"
    startCommand: "uv run tasks-mcp"
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: TOKEN_STORE_PATH
        value: /opt/render/project/src/token_store.json
